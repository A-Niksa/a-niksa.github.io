name: Build academic CV

on:
  push:
    paths:
      - "cv/academic-cv.tex"
      - ".github/workflows/build-academic-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-extra latexmk

      - name: Compile academic CV
        run: |
          mkdir -p build
          latexmk -pdf -interaction=nonstopmode -halt-on-error -output-directory=build cv/academic-cv.tex
          cp build/academic-cv.pdf docs/assets/academic-cv.pdf

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- docs/assets/academic-cv.pdf; then
            echo "Academic CV PDF is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/academic-cv.pdf
          git commit -m "Rebuild academic CV PDF"
          git push
